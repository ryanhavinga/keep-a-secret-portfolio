<!DOCTYPE html>
<html lang="en" class="demos-html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demos — Keep A Secret</title>
<meta name="description" content="Finished songs, ready to cut. By invitation only.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#08080a">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Keep A Secret">
<meta property="og:title" content="Keep A Secret — Demos">
<meta property="og:description" content="Finished songs, ready to cut. By invitation only.">
<meta property="og:url" content="https://keepasecret.nl/demos.html">
<meta property="og:image" content="https://keepasecret.nl/img/track-1.jpg">

<link rel="preload" as="font" type="font/otf" href="fonts/MonumentExtended-Ultrabold.otf" crossorigin>
<link rel="preload" as="font" type="font/otf" href="fonts/MonumentExtended-Regular.otf" crossorigin>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/demos.css">
<script>
/* Keeps the lettering out of sight until Monument Extended is in, instead
   of flashing it in a fallback face first. Gives up after 1.2s so a slow
   or failed font can never hold the page back. */
(function () {
  var d = document.documentElement, done = function () { d.classList.remove('fonts-wait'); };
  d.classList.add('fonts-wait');
  try {
    Promise.all([document.fonts.load('800 1em "Monument Extended"'), document.fonts.load('400 1em "Monument Extended"')]).then(done, done);
  } catch (e) { done(); }
  setTimeout(done, 1200);
})();
</script>
<script src="js/transition.js"></script>
</head>
<body class="page-demos">

<!-- the way between the pages: the slider sits under the one you are on (js/nav.js). -->
<nav class="seg" data-seg aria-label="Pages">
  <span class="seg__thumb" aria-hidden="true"></span>
  <a class="seg__btn" href="index.html">Portfolio</a>
  <a class="seg__btn" href="demos.html" aria-current="page">Demos</a>
</nav>

<header class="vlt__bar">
  <a class="wordmark" href="index.html">
    <span class="wordmark__main">Keep A Secret</span>
  </a>
  <a class="tag" data-contact-link href="mailto:contact@keepasecret.nl">Contact</a>
</header>

<!-- the open collection: stays at the top, under the wordmark and the page pill, with the
     collection that is open ("Showing …"). The list scrolls underneath it. Shown (js/demos.js) only while a collection is open. -->
<div class="band" data-band hidden>
  <div class="band__in">
    <div class="code__active" data-code-active hidden>
      <div class="code__who">
        <span class="code__showing">Showing your selection</span>
        <b class="code__name" data-code-name></b>
      </div>
      <button class="code__clear" type="button" data-code-clear>Clear</button>
    </div>
  </div>
</div>

<main class="vlt">
  <!-- no visible title — the pill already says where you are; the page keeps one for screen readers -->
  <h1 class="vlt__title">Demos</h1>

  <div class="vlt__in">

  <!-- the code bar: nothing is listed until a code (e.g. HAP) is given; then only that collection. Not a lock — see CONFIG.demos.collections -->
  <form class="code" data-code-form autocomplete="off" novalidate>
    <label class="code__label" for="code">Collection code</label>
    <input class="code__input" id="code" data-code-input type="text" autocapitalize="characters" autocomplete="off"
           spellcheck="false" placeholder="Enter your code" aria-describedby="code-note">
    <button class="code__go" type="submit" aria-label="Show my demos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </button>
  </form>
  <p class="code__note" id="code-note" data-code-note role="status" aria-live="polite"></p>

  <!-- one heading and one list per language, one row per song, built from CONFIG.demos.tracks -->
  <div data-groups></div>
  </div>
</main>

<!-- the now-playing bar: slides up as soon as a song has been started (js/demos.js).
     The song on the left, previous / play / next exactly in the middle, on the right the time and the timeline, with the speaker at the far end: press it and it slides left over the timeline, drawing
     a volume line out behind it (as on the portfolio). -->
<section class="np" data-np aria-label="Now playing">
  <div class="np__who">
    <span class="np__art" data-np-art aria-hidden="true"></span>
    <span class="np__text"><b data-np-title></b><span>Keep A Secret</span></span>
  </div>
  <div class="np__ctrl">
    <button class="np__btn" type="button" data-np-prev aria-label="Previous song">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 9.5 12 18 18Z"/><path d="M6 6v12"/></svg>
    </button>
    <button class="np__btn np__btn--play" type="button" data-np-play aria-label="Play">
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5.5 19 12 9 18.5Z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="5" width="5" height="14" rx="1.5"/><rect x="13.5" y="5" width="5" height="14" rx="1.5"/></svg>
    </button>
    <button class="np__btn" type="button" data-np-next aria-label="Next song">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6 14.5 12 6 18Z"/><path d="M18 6v12"/></svg>
    </button>
  </div>
  <div class="np__right">
    <div class="np__seek" data-np-seek>
      <span class="np__t"><span data-np-cur>0:00</span> / <span data-np-dur>0:00</span></span>
      <div class="np__bar" data-np-bar role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="np__rail"><div class="np__fill" data-np-fill></div></div>
      </div>
    </div>
    <div class="np__vol">
      <button class="np__btn np__btn--vol" data-np-vol type="button" aria-label="Volume" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="i-body" d="M4 9.6v4.8h3.6L12.4 18.4V5.6L7.6 9.6Z"/>
          <path class="i-wave" d="M15.6 9.2a4 4 0 0 1 0 5.6M18.2 6.6a7.6 7.6 0 0 1 0 10.8"/>
          <path class="i-mute" d="M15.6 9.6l5 4.8M20.6 9.6l-5 4.8"/>
        </svg>
      </button>
      <div class="np__flyout" data-np-flyout>
        <div class="np__vtrack" data-np-vtrack role="slider" tabindex="0" aria-label="Volume" aria-orientation="horizontal"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="40">
          <div class="np__vfill" data-np-vfill></div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- outside <main> on purpose: <main> scrolls and fades at its edges, the credit line stays put under it -->
<footer class="vlt__foot">
  <p>&copy; Keep A Secret. All Rights Reserved</p>
  <p>Written &amp; Produced by Keep A Secret</p>
</footer>

<audio data-audio preload="none"></audio>

<script src="js/config.js"></script>
<script src="js/nav.js"></script>
<script src="js/demos.js"></script>
</body>
</html>
