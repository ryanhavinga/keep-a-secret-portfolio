<!DOCTYPE html>
<html lang="en" class="pf-html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keep A Secret — Portfolio</title>
<meta name="description" content="A private listening room. By invitation only.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#08080a">

<!-- Link-preview cards only — the page above is noindex, so none of this
     is for search, only for how the bare link looks pasted into an email,
     Slack DM, or iMessage sent to an A&R. Deliberately keepasecret.nl,
     not demo-portal.keepasecret.nl — that's the one actually being sent
     out, CLAUDE.md's "primary URL to hand out" note notwithstanding. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Keep A Secret">
<meta property="og:title" content="Keep A Secret — Demo Portal">
<meta property="og:description" content="A private listening room. By invitation only.">
<meta property="og:url" content="https://keepasecret.nl/">
<meta property="og:image" content="https://keepasecret.nl/img/og-preview.jpg">
<meta property="og:image:width" content="1000">
<meta property="og:image:height" content="1000">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Keep A Secret — Demo Portal">
<meta name="twitter:description" content="A private listening room. By invitation only.">
<meta name="twitter:image" content="https://keepasecret.nl/img/og-preview.jpg">

<script>
/* Which design this device gets: the shelf of covers (index.html) is for screens with a mouse; on a phone (a touch screen
   with a short side of 500px or less) the Portfolio is this player page instead. ?layout=phone or ?layout=desktop forces one. */
(function () {
  var f = /[?&]layout=(phone|desktop)/.exec(location.search);
  var phone = f ? f[1] === 'phone' : navigator.maxTouchPoints > 0 && Math.min(innerWidth, innerHeight) <= 500;
  if (phone) location.replace('player.html' + (f ? '?layout=' + f[1] : ''));
})();
</script>

<link rel="preload" as="font" type="font/otf" href="fonts/MonumentExtended-Ultrabold.otf" crossorigin>
<link rel="preload" as="font" type="font/otf" href="fonts/MonumentExtended-Regular.otf" crossorigin>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/portfolio.css">
<script>
/* Keeps the lettering out of sight until Monument Extended is in, instead
   of flashing it in a fallback face first (see the note in demos.html). */
(function () {
  var d = document.documentElement, done = function () { d.classList.remove('fonts-wait'); };
  d.classList.add('fonts-wait');
  try {
    Promise.all([document.fonts.load('800 1em "Monument Extended"'), document.fonts.load('400 1em "Monument Extended"')]).then(done, done);
  } catch (e) { done(); }
  setTimeout(done, 1200);
})();
</script>
<!-- The demos page is one click away: fetch it quietly in the background so it is up the instant it's opened. -->
<link rel="prefetch" href="demos.html">
<link rel="prefetch" href="css/demos.css">
<link rel="prefetch" href="js/demos.js" as="script">
<script src="js/transition.js"></script>
</head>
<body class="page-pf">

<header class="pf__bar">
  <div class="wordmark">
    <span class="wordmark__main">Keep A Secret</span>
    <span class="wordmark__sub">Portfolio</span>
  </div>
  <nav class="topbar__links">
    <a class="tag" href="contact.html">Contact</a>
  </nav>
</header>

<!-- the way between the pages: the slider sits under the one you are on (js/nav.js). -->
<nav class="seg" data-seg aria-label="Pages">
  <span class="seg__thumb" aria-hidden="true"></span>
  <a class="seg__btn" href="index.html" aria-current="page">Portfolio</a>
  <a class="seg__btn" href="demos.html">Demos</a>
</nav>

<main class="pf" data-pf>
  <h1 class="pf__title" data-pf-heading>Portfolio</h1>

  <!-- one cover per track, built from CONFIG.portfolio.tracks -->
  <div class="floor" data-floor aria-hidden="true"></div>
  <ol class="shelf" data-shelf></ol>

  <!-- bottom left, level with the credit line: Instagram and the Spotify playlist
       (hrefs set from CONFIG.instagram / CONFIG.spotify by js/portfolio.js) -->
  <div class="socials">
    <a data-instagram href="#" target="_blank" rel="noopener noreferrer" aria-label="Instagram" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3.5" y="3.5" width="17" height="17" rx="5"/>
        <circle cx="12" cy="12" r="4.2"/>
        <circle cx="17.1" cy="6.9" r="1"/>
      </svg>
    </a>
    <a data-spotify-playlist href="#" target="_blank" rel="noopener noreferrer" aria-label="Spotify playlist" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9.5"/>
        <path d="M6.9 9.2c3.6-1 7.6-.7 10.6 1.1M7.4 12.3c3-.8 6.2-.5 8.7 1M7.9 15.2c2.4-.6 4.7-.3 6.7.8"/>
      </svg>
    </a>
  </div>

  <footer class="pf__foot">
    <p>&copy; Keep A Secret. All Rights Reserved</p>
    <p>Written &amp; Produced by Keep A Secret</p>
  </footer>
</main>

<!-- ══════════ A COVER PULLED OUT OF THE SHELF ══════════
     Opened by js/portfolio.js: the cover slides out of the stack and turns
     to face you, the shelf dims behind it, and its details come in on the
     right. -->
<div class="focus" data-focus hidden>
  <div class="focus__veil" data-veil></div>

  <div class="focus__stage" data-stage>
    <div class="focus__card" data-card><img data-card-img alt=""></div>
  </div>

  <section class="focus__info" data-info>
    <h2 class="focus__title" data-title></h2>
    <p class="focus__artist" data-artist></p>
    <p class="focus__line" data-year hidden></p>
    <p class="focus__note" data-note hidden></p>

    <div class="focus__player" data-player hidden>
      <button class="focus__play" data-play type="button" aria-label="Play">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5.5 19 12 9 18.5Z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="5" width="5" height="14" rx="1.5"/><rect x="13.5" y="5" width="5" height="14" rx="1.5"/></svg>
      </button>
      <div class="focus__scrub" data-scrub role="slider" tabindex="0" aria-label="Seek"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="focus__track"><div class="focus__fill" data-fill></div></div>
      </div>
      <span class="focus__time" data-time>0:00</span>
    </div>

    <div class="focus__credits" data-credits hidden></div>
    <div class="focus__links" data-links></div>
    <p class="focus__credit" data-credit-line>Written &amp; Produced by Keep A Secret</p>
  </section>

  <!-- small streaming icons, bottom right: they go to the track's own link when
       CONFIG.portfolio gives one (spotify / apple), otherwise to a search for it -->
  <div class="focus__stream">
    <a class="focus__svc" data-spotify target="_blank" rel="noopener noreferrer" aria-label="Listen on Spotify" title="Spotify">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M5.9 9.1c4.3-1.2 9-.8 12.6 1.4M6.5 12.4c3.6-.9 7.3-.6 10.3 1.2M7.1 15.5c2.9-.7 5.7-.4 8.1.9" fill="none" stroke="#060607" stroke-width="1.8" stroke-linecap="round"/></svg>
    </a>
    <a class="focus__svc" data-apple target="_blank" rel="noopener noreferrer" aria-label="Listen on Apple Music" title="Apple Music">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="5.5" fill="currentColor"/><path d="M9.1 17.3a2.1 2.1 0 1 1-1.3-1.9V8.4a.9.9 0 0 1 .7-.9l6.6-1.4a.9.9 0 0 1 1.1.9v8.4a2.1 2.1 0 1 1-1.3-1.9V8.6l-5.1 1.1z" fill="#060607"/></svg>
    </a>
  </div>

  <button class="focus__close" data-close type="button" aria-label="Back to the shelf">Back</button>
  <button class="focus__nav focus__nav--prev" data-prev type="button" aria-label="Previous">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
  </button>
  <button class="focus__nav focus__nav--next" data-next type="button" aria-label="Next">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>
</div>

<!-- ══════════ NOW PLAYING ══════════
     A glass bar over the foot of the shelf, Apple Music style: the track's
     artwork, title and artist, previous / play / next, and a thin timeline
     along its bottom edge. Runs js/portfolio.js's NowPlaying, over the tracks
     in CONFIG.portfolio that have audio. -->
<div class="np" data-np role="region" aria-label="Now playing">
  <div class="np__ctrl">
    <button class="np__btn" data-np-prev type="button" aria-label="Previous">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 9.5 12 18 18Z"/><path d="M6 6v12"/></svg>
    </button>
    <button class="np__btn np__btn--play" data-np-play type="button" aria-label="Play">
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5.5 19 12 9 18.5Z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="5" width="5" height="14" rx="1.5"/><rect x="13.5" y="5" width="5" height="14" rx="1.5"/></svg>
    </button>
    <button class="np__btn" data-np-next type="button" aria-label="Next">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6 14.5 12 6 18Z"/><path d="M18 6v12"/></svg>
    </button>
  </div>
  <div class="np__mid" data-np-mid>
    <button class="np__who" data-np-open type="button" aria-label="Show credits">
      <img class="np__art" data-np-art alt="">
      <span class="np__text"><b data-np-title></b><span data-np-artist></span></span>
    </button>
    <!-- hover the hairline for half a second and the artwork and title give way to the times
         (centred on the bar) with a timeline under them; leave and it sinks away again, fast -->
    <div class="np__time" aria-hidden="true">
      <span class="np__tl"><span class="np__t" data-np-elapsed>0:00</span><span class="np__t" data-np-total>0:00</span></span>
      <div class="np__tscrub" data-np-tscrub>
        <div class="np__ttrack"><div class="np__tfill" data-np-tfill></div></div>
      </div>
    </div>
    <div class="np__scrub" data-np-scrub role="slider" tabindex="0" aria-label="Seek"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="np__track"><div class="np__fill" data-np-fill></div></div>
    </div>
  </div>
  <div class="np__vol">
    <button class="np__btn np__btn--vol" data-np-vol type="button" aria-label="Volume" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="i-body" d="M4 9.6v4.8h3.6L12.4 18.4V5.6L7.6 9.6Z"/>
        <path class="i-wave" d="M15.6 9.2a4 4 0 0 1 0 5.6M18.2 6.6a7.6 7.6 0 0 1 0 10.8"/>
        <path class="i-mute" d="M15.6 9.6l5 4.8M20.6 9.6l-5 4.8"/>
      </svg>
    </button>
    <div class="np__flyout" data-np-flyout>
      <div class="np__vtrack" data-np-vtrack role="slider" tabindex="0" aria-label="Volume" aria-orientation="vertical"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="40">
        <div class="np__vfill" data-np-vfill></div>
      </div>
    </div>
  </div>
</div>

<audio data-audio preload="none"></audio>
<audio data-np-audio preload="none"></audio>

<script src="js/config.js"></script>
<script src="js/nav.js"></script>
<script src="js/portfolio.js"></script>
</body>
</html>
