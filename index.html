<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keep A Secret — Private Listening</title>
<meta name="description" content="A private listening room. By invitation only.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#08080a">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- The doorman. Everything behind it is already in the page and the
     password is in js/config.js, so this gates the link, not the content —
     see the note on CONFIG.gate. -->
<div class="gate" data-gate>
  <div class="gate__inner">
    <p class="gate__mark">Keep A Secret</p>
    <p class="gate__sub">Demo Portal</p>
    <p class="gate__eyebrow">By invitation</p>
    <form class="gate__form" data-gate-form>
      <input class="gate__input" data-gate-input type="password" placeholder="Password"
             aria-label="Password" autocomplete="off" autocapitalize="characters"
             autocorrect="off" spellcheck="false" autofocus>
      <button class="gate__btn" type="submit">Enter</button>
    </form>
  </div>
</div>

<!-- cinematic environment layers -->
<div class="env" aria-hidden="true">
  <!-- The track-change surge (brighter, more saturated, easing back down)
       lives on these two `.light-surge` wrappers rather than on the ring/
       leds elements themselves, which each carry their own infinite
       `flicker` animation — kept on a plain ancestor instead so the two
       effects are never fighting for the same element's style. `filter`
       on the wrapper still visually reaches every pixel underneath it.
       Split in two because .env__mesh has to sit between the main light
       and the bloom in front of it. -->
  <div class="light-surge">
    <!-- the light: a bright band, big enough to run off the bottom of the screen -->
    <div class="ring ring--glow"></div>
    <div class="ring ring--core"></div>
    <!-- the lamp itself: one lit point per hole in the grille, band-masked,
         then broken up by low-frequency noise so it never reads as a flat
         glow. __accents paints over __dots, scattering cells of a
         contrasting hue through the field. -->
    <div class="leds">
      <div class="leds__noise">
        <div class="leds__dots"></div>
        <div class="leds__accents"></div>
      </div>
    </div>
  </div>
  <!-- the perforated black grille sits on top, one hole per lit point -->
  <div class="env__mesh"></div>
  <!-- bloom in front of the grille -->
  <div class="light-surge">
    <div class="ring ring--bloom"></div>
  </div>
  <canvas class="env__grain" data-grain></canvas>
  <div class="env__vignette"></div>
</div>

<!-- Softens the room behind the volume flyout while it's open, for
     legibility against a busy background — toggled via body.is-volume-open
     (js/app.js, openVolume/closeVolume). Sits above .env (z-index 0) and
     below .stage (10), so the light and grain blur while the player itself
     stays sharp. -->
<div class="scene-blur" aria-hidden="true"></div>

<header class="topbar">
  <div class="wordmark" data-logo>
    <span class="wordmark__main" data-logo-main>Keep A Secret</span>
    <span class="wordmark__sub" data-logo-sub>Portfolio</span>
  </div>
  <a class="tag" data-tagline href="contact.html">Private Session</a>
</header>

<main class="stage">
  <!-- Track switching still works without the big edge arrows that used to
       live here: the small transport buttons below, the keyboard's ←/→,
       clicking a side cover, and dragging the cover stack itself. -->

  <div class="carousel" data-carousel>

    <!-- ══════════ BLOCK 1 — MUSIC PLAYER ══════════ -->
    <article class="block block--player" data-block="player" tabindex="0">
      <div class="player">

        <!-- cover stack: the playing track, with its neighbours tucked behind.
             Built from CONFIG.tracks by app.js — click a side cover to switch.
             Static otherwise — swiping steps tracks by spinning the title/
             artist carousel below instead, Apple Music-style; the artwork
             only ever swaps, at the moment a track actually changes. -->
        <div class="covers" data-covers></div>

        <!-- one .meta-item per track (built by app.js, same as .covers) —
             a horizontal title/artist carousel that tracks a swipe live,
             independent of the artwork above it. -->
        <div class="player__meta" data-meta></div>

        <div class="transport">
          <div class="timeline">
            <span class="timeline__t" data-current>0:00</span>
            <div class="scrub" data-scrub role="slider" tabindex="0"
                 aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="scrub__track"><div class="scrub__fill" data-fill></div></div>
              <span class="scrub__head" data-head></span>
            </div>
            <!-- volume flyout: rises directly above this button rather than
                 beside the artwork, so it stays anchored to the control
                 that opens it wherever the timeline row lands. -->
            <div class="vol-wrap">
              <button class="vol-toggle" data-vol-toggle type="button"
                      aria-label="Volume" aria-expanded="false" aria-controls="volume-flyout">
                <svg class="vol-toggle__icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 9.5h3.4L12 6v12l-4.6-3.5H4Z"/>
                  <path d="M15.2 9.2a3.6 3.6 0 0 1 0 5.6" fill="none"/>
                  <path d="M17.4 6.8a7 7 0 0 1 0 10.4" fill="none"/>
                  <path class="vol-toggle__mute-line" d="M3 20 21 4" fill="none"/>
                </svg>
              </button>
              <div class="volume" data-volume id="volume-flyout">
                <div class="volume__track" data-vol-track role="slider" tabindex="0"
                     aria-label="Volume" aria-orientation="vertical"
                     aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
                  <div class="volume__bar">
                    <div class="volume__fill" data-vol-fill></div>
                    <span class="volume__head" data-vol-head></span>
                  </div>
                </div>
              </div>
            </div>
            <span class="timeline__t" data-duration>0:00</span>
          </div>

          <div class="controls">
            <button class="ctrl ctrl--side" data-prev aria-label="Previous track">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 9.5 12 18 18Z"/><path d="M6 6v12"/></svg>
            </button>

            <button class="ctrl ctrl--play" data-play aria-label="Play">
              <svg class="ctrl__icon ctrl__icon--play" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5.5 19 12 9 18.5Z"/></svg>
              <svg class="ctrl__icon ctrl__icon--pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="5" width="5" height="14" rx="1.5"/><rect x="13.5" y="5" width="5" height="14" rx="1.5"/></svg>
            </button>

            <button class="ctrl ctrl--side" data-next aria-label="Next track">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6 14.5 12 6 18Z"/><path d="M18 6v12"/></svg>
            </button>
          </div>

          <p class="player__note" data-note hidden>Preview timeline — audio pending</p>
        </div>
      </div>
    </article>

    <!-- The TikTok and Bio panels used to live here. Their content is still
         in js/config.js (CONFIG.tiktok, CONFIG.bio) so nothing is lost —
         app.js just skips anything whose markup isn't in the page. -->

  </div>
</main>

<div class="footer-credit">
  <p>&copy; Keep A Secret. All Rights Reserved</p>
  <p>Written &amp; Produced by Keep A Secret</p>
</div>

<a class="social" data-instagram href="#" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <rect x="3.5" y="3.5" width="17" height="17" rx="5"/>
    <circle cx="12" cy="12" r="4.2"/>
    <circle cx="17.1" cy="6.9" r="1"/>
  </svg>
</a>

<audio data-audio preload="metadata"></audio>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
