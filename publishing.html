<!DOCTYPE html>
<html lang="en" class="pub-html">
<head>
<script>
/* The same pre-paint trick as index.html's first script: if this session
   has already got in with the publishing password, the door is hidden
   before anything paints. The flag is this page's own — it is set by
   typing the HAP password (see CONFIG.gate.redirects) and does not open
   the portfolio or the Vault. */
try {
  if (sessionStorage.getItem('kas-publishing') === '1') {
    document.documentElement.classList.add('is-remembered');
  }
} catch (_) {}
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demos for Publishers — Keep A Secret</title>
<meta name="description" content="English-language demos by Keep A Secret. By invitation only.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#08080a">

<link rel="preload" as="font" type="font/otf" href="fonts/MonumentExtended-Ultrabold.otf" crossorigin>
<link rel="preload" as="font" type="font/otf" href="fonts/MonumentExtended-Regular.otf" crossorigin>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/publishing.css">
<script>
/* Keeps the lettering out of sight until Monument Extended is in, instead
   of flashing it in the fallback face first — see the same note in
   vault.html. Gives up after 1.2s. */
(function () {
  var d = document.documentElement, done = function () { d.classList.remove('fonts-wait'); };
  d.classList.add('fonts-wait');
  try {
    Promise.all([document.fonts.load('800 1em "Monument Extended"'), document.fonts.load('400 1em "Monument Extended"')]).then(done, done);
  } catch (e) { done(); }
  setTimeout(done, 1200);
})();
</script>
<script src="js/transition.js"></script>
</head>
<body class="page-pub">

<!-- The door — only the HAP password opens this page. A doorman, not a
     lock: see the note on CONFIG.gate in js/config.js. -->
<div class="gate" data-gate>
  <div class="gate__inner">
    <p class="gate__mark">Keep A Secret</p>
    <p class="gate__eyebrow">By invitation</p>
    <form class="gate__form" data-gate-form>
      <input class="gate__input" data-gate-input type="password" placeholder="Password"
             aria-label="Password" autocomplete="off" autocapitalize="characters"
             autocorrect="off" spellcheck="false" autofocus>
      <button class="gate__btn" type="submit">Enter</button>
    </form>
  </div>
</div>

<header class="pub__bar">
  <div class="wordmark">
    <span class="wordmark__main">Keep A Secret</span>
    <span class="wordmark__sub">Publishing</span>
  </div>
  <a class="tag" data-contact-link href="mailto:contact@keepasecret.nl">Contact</a>
</header>

<main class="pub">
  <h1 class="pub__title" data-pub-heading>Demos</h1>

  <!-- one row per song, built from CONFIG.publishing.tracks -->
  <ol class="rows" data-rows></ol>

  <footer class="pub__foot">
    <p>&copy; Keep A Secret. All Rights Reserved</p>
    <p>Written &amp; Produced by Keep A Secret</p>
  </footer>
</main>

<audio data-audio preload="none"></audio>

<script src="js/config.js"></script>
<script src="js/publishing.js"></script>
</body>
</html>
