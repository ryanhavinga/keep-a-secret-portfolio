<!DOCTYPE html>
<html lang="en" class="pf-html">
<head>
<script>
/* The same pre-paint trick as index.html's first script: a session that has
   already typed the password never sees the door. Shares the portfolio's
   own flag, so one entry covers the player, this page and the Vault. */
try {
  if (sessionStorage.getItem('kas-entered') === '1') {
    document.documentElement.classList.add('is-remembered');
  }
} catch (_) {}
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio — Keep A Secret</title>
<meta name="description" content="Everything Keep A Secret has made. By invitation only.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#08080a">

<link rel="preload" as="font" type="font/otf" href="fonts/MonumentExtended-Ultrabold.otf" crossorigin>
<link rel="preload" as="font" type="font/otf" href="fonts/MonumentExtended-Regular.otf" crossorigin>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/portfolio.css">
<script>
/* Keeps the lettering out of sight until Monument Extended is in, instead
   of flashing it in a fallback face first (see the note in vault.html). */
(function () {
  var d = document.documentElement, done = function () { d.classList.remove('fonts-wait'); };
  d.classList.add('fonts-wait');
  try {
    Promise.all([document.fonts.load('800 1em "Monument Extended"'), document.fonts.load('400 1em "Monument Extended"')]).then(done, done);
  } catch (e) { done(); }
  setTimeout(done, 1200);
})();
</script>
<script src="js/transition.js"></script>
</head>
<body class="page-pf">

<div class="gate" data-gate>
  <div class="gate__inner">
    <p class="gate__mark">Keep A Secret</p>
    <p class="gate__eyebrow">By invitation</p>
    <form class="gate__form" data-gate-form>
      <input class="gate__input" data-gate-input type="password" placeholder="Password"
             aria-label="Password" autocomplete="off" autocapitalize="characters"
             autocorrect="off" spellcheck="false" autofocus>
      <button class="gate__btn" type="submit">Enter</button>
    </form>
  </div>
</div>

<header class="pf__bar">
  <a class="wordmark" href="index.html">
    <span class="wordmark__main">Keep A Secret</span>
    <span class="wordmark__sub">Portfolio</span>
  </a>
  <nav class="topbar__links">
    <a class="tag" href="index.html">Player</a>
    <!-- The Vault is switched off for now: <a class="tag" href="vault.html">The Vault</a> -->
    <a class="tag" href="contact.html">Contact</a>
  </nav>
</header>

<!-- the filter: a pill at the top with a slider that glides to whichever
     artist is chosen. The buttons are built from CONFIG.portfolio by
     js/portfolio.js. -->
<div class="seg" data-seg role="group" aria-label="Show">
  <span class="seg__thumb" aria-hidden="true"></span>
</div>

<main class="pf" data-pf>
  <h1 class="pf__title" data-pf-heading>Portfolio</h1>

  <!-- one cover per track, built from CONFIG.portfolio.tracks -->
  <div class="floor" data-floor aria-hidden="true"></div>
  <ol class="shelf" data-shelf></ol>

  <footer class="pf__foot">
    <p>&copy; Keep A Secret. All Rights Reserved</p>
    <p>Written &amp; Produced by Keep A Secret</p>
  </footer>
</main>

<!-- ══════════ A COVER PULLED OUT OF THE SHELF ══════════
     Opened by js/portfolio.js: the cover slides out of the stack and turns
     to face you, the shelf dims behind it, and its details come in on the
     right. -->
<div class="focus" data-focus hidden>
  <div class="focus__veil" data-veil></div>

  <div class="focus__stage" data-stage>
    <div class="focus__card" data-card><img data-card-img alt=""></div>
  </div>

  <section class="focus__info" data-info>
    <h2 class="focus__title" data-title></h2>
    <p class="focus__artist" data-artist></p>
    <p class="focus__line" data-year hidden></p>
    <p class="focus__note" data-note hidden></p>

    <div class="focus__player" data-player hidden>
      <button class="focus__play" data-play type="button" aria-label="Play">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5.5 19 12 9 18.5Z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="5" width="5" height="14" rx="1.5"/><rect x="13.5" y="5" width="5" height="14" rx="1.5"/></svg>
      </button>
      <div class="focus__scrub" data-scrub role="slider" tabindex="0" aria-label="Seek"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="focus__track"><div class="focus__fill" data-fill></div></div>
      </div>
      <span class="focus__time" data-time>0:00</span>
    </div>

    <div class="focus__credits" data-credits hidden></div>
    <div class="focus__links" data-links></div>
    <p class="focus__credit" data-credit-line>Written &amp; Produced by Keep A Secret</p>
  </section>

  <!-- small streaming icons, bottom right: they go to the track's own link when
       CONFIG.portfolio gives one (spotify / apple), otherwise to a search for it -->
  <div class="focus__stream">
    <a class="focus__svc" data-spotify target="_blank" rel="noopener noreferrer" aria-label="Listen on Spotify" title="Spotify">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M5.9 9.1c4.3-1.2 9-.8 12.6 1.4M6.5 12.4c3.6-.9 7.3-.6 10.3 1.2M7.1 15.5c2.9-.7 5.7-.4 8.1.9" fill="none" stroke="#060607" stroke-width="1.8" stroke-linecap="round"/></svg>
    </a>
    <a class="focus__svc" data-apple target="_blank" rel="noopener noreferrer" aria-label="Listen on Apple Music" title="Apple Music">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="5.5" fill="currentColor"/><path d="M9.1 17.3a2.1 2.1 0 1 1-1.3-1.9V8.4a.9.9 0 0 1 .7-.9l6.6-1.4a.9.9 0 0 1 1.1.9v8.4a2.1 2.1 0 1 1-1.3-1.9V8.6l-5.1 1.1z" fill="#060607"/></svg>
    </a>
  </div>

  <button class="focus__close" data-close type="button" aria-label="Back to the shelf">Back</button>
  <button class="focus__nav focus__nav--prev" data-prev type="button" aria-label="Previous">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
  </button>
  <button class="focus__nav focus__nav--next" data-next type="button" aria-label="Next">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>
</div>

<audio data-audio preload="none"></audio>

<script src="js/config.js"></script>
<script src="js/portfolio.js"></script>
</body>
</html>
